name: tag

on:
  workflow_dispatch:
    inputs:
      tag:
        type: string
        description: "version tag (vx.x.x)"
        required: true

permissions: {}

jobs:
  tag_push:
    runs-on: ubuntu-24.04-arm
    timeout-minutes: 10
    # Protection rules (required reviewers) and the App secrets belong to
    # this environment in the repository settings.
    environment: release
    permissions:
      contents: read
    steps:
      # Fail before the App token exists: release tags come from main and
      # follow vX.Y.Z. The values are not echoed, since the runner would
      # parse workflow commands out of them.
      - name: Validate ref and tag
        run: |
          if [[ "$REF" != "refs/heads/main" ]]; then
            echo "release tags must be created from main" >&2
            exit 1
          fi
          if [[ ! "$TAG" =~ ^v[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            echo "tag must look like vX.Y.Z" >&2
            exit 1
          fi
        env:
          REF: ${{ github.ref }}
          TAG: ${{ inputs.tag }}
      - name: Create GitHub App Token
        uses: actions/create-github-app-token@64ab729a6294000f5aa4a4bc0b73d1f32bc45510 # v3.3.0
        id: app-token
        with:
          app-id: ${{ secrets.APP_ID }}
          private-key: ${{ secrets.PRIVATE_KEY }}
          permission-contents: write
      - name: Push git tag
        run: |
          gh api \
            --method POST \
            -H "Accept: application/vnd.github+json" \
            -H "X-GitHub-Api-Version: 2022-11-28" \
            "/repos/${REPOSITORY}/git/refs" \
            -f "ref=refs/tags/${TAG}" \
            -f "sha=${SHA}"
        env:
          GITHUB_TOKEN: ${{ steps.app-token.outputs.token }}
          REPOSITORY: ${{ github.repository }}
          TAG: ${{ inputs.tag }}
          SHA: ${{ github.sha }}
